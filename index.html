<style>
:root{
  color-scheme:light;
  --bg:#EDF1F0; --surface:#FFFFFF; --ink:#13262B; --muted:#586C70; --line:#D3DCDB;
  --accent:#0E7C7B; --accent-ink:#FFFFFF; --on-bg:#D6EEEE;
  --ok:#1F7A4D; --ok-bg:#DDF1E6; --warn:#8A5F00; --warn-bg:#FBEFCB; --bad:#B3261E; --bad-bg:#FADAD6;

  --font-body:'Inter',system-ui,sans-serif;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1A1D; --surface:#16272B; --ink:#E6EFEE; --muted:#93A8AC; --line:#2A3F44;
    --accent:#4FC1BE; --accent-ink:#06201F; --on-bg:#14383A;
    --ok:#6FD3A0; --ok-bg:#16362A; --warn:#F2C45A; --warn-bg:#3A2F10; --bad:#FF8A80; --bad-bg:#43201D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1A1D; --surface:#16272B; --ink:#E6EFEE; --muted:#93A8AC; --line:#2A3F44;
  --accent:#4FC1BE; --accent-ink:#06201F; --on-bg:#14383A;
  --ok:#6FD3A0; --ok-bg:#16362A; --warn:#F2C45A; --warn-bg:#3A2F10; --bad:#FF8A80; --bad-bg:#43201D;
}
*{box-sizing:border-box}
html{font-family:var(--font-body)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font:700 1.7rem/1.1 var(--font-display);margin:0;letter-spacing:-.01em}
.date{color:var(--muted);margin:4px 0 0}
.clk{font:600 .95rem var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.hright{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{font:600 .9rem var(--font-body);color:var(--muted);background:none;border:0;border-radius:7px;padding:9px 16px;min-height:40px;cursor:pointer}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-weight:500}

.summary{margin:0;color:var(--muted);font-weight:500}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card[data-state="ok"]{border-color:var(--accent)}

.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h3{font:600 1.1rem/1.2 var(--font-display);margin:0;overflow-wrap:anywhere}
.pill{display:inline-block;font:600 .75rem/1 var(--font-body);letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:6px 10px;white-space:nowrap}
.pill.idle{background:var(--bg);color:var(--muted)}
.pill.on{background:var(--on-bg);color:var(--accent)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}

.timer{font:600 2.4rem/1 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card[data-state="over"] .timer{color:var(--bad)}
.card[data-state="warn"] .timer{color:var(--warn)}
.card[data-state="sched"] .timer{color:var(--muted)}
.sub{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.85rem;margin:0}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--accent);transition:width .4s linear}
.card[data-state="warn"] .meter span{background:var(--warn)}
.card[data-state="over"] .meter span{background:var(--bad)}
.today{color:var(--muted);font-size:.85rem;margin:0}
.btn{font:600 .95rem var(--font-body);min-height:44px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:0 16px;cursor:pointer}
.btn.secondary{background:transparent;color:var(--accent)}
.btn.quiet{border-color:var(--line);color:var(--muted);background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.types{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 90px;min-height:52px;border-radius:8px;border:1px solid var(--accent);background:var(--on-bg);color:var(--ink);cursor:pointer;padding:6px 10px;font:600 .9rem var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.chip small{font-weight:500;color:var(--muted);font-size:.75rem}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:var(--accent-ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty strong{color:var(--ink);font:600 1.05rem var(--font-display)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.narrow{max-width:420px}
h2{font:600 1.1rem var(--font-display);margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=number],input[type=time],input[type=email],input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:44px;min-width:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font:600 .72rem var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:600;border-bottom:0;background:var(--bg)}
.note{color:var(--muted);font-size:.85rem;margin:0}
.err{color:var(--bad);font-size:.85rem;margin:0;font-weight:500}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item span{overflow-wrap:anywhere;min-width:0}
.typerow{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:calc(100vw - 32px);z-index:20}
@media (prefers-reduced-motion:reduce){.meter span{transition:none}}
.tagline{margin:2px 0 6px;font-size:.95rem;font-weight:500;color:var(--accent,#0f7d7a);letter-spacing:.01em}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border:2px solid var(--bad);border-radius:14px;max-width:420px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal h2{margin:0 0 8px;color:var(--bad);font-size:1.25rem}
.modal ul{margin:0 0 16px;padding-left:20px}
.modal li{margin:4px 0}
.cred{background:var(--ok-bg);border:1px solid var(--ok);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.cred b{font-family:var(--font-mono)}
textarea{font:inherit;font-family:var(--font-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;box-sizing:border-box;min-height:120px}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(70px,110px) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.9rem}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .a{background:var(--accent)}
.bar .o{background:var(--bad)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.typerow{grid-template-columns:minmax(0,1fr) 84px 84px auto !important}
.tr-lab{font-size:.75rem;color:var(--muted)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="wrap" id="app"><p class="note">Loading…</p></div>

<script>
(function(){
'use strict';
var DEFAULT_TYPES=[{name:'Lunch',allowed:30},{name:'Tea / Coffee',allowed:15},{name:'Other',allowed:10}];
var CONF=window.BREAK_BOARD_CONFIG||{};
var cfg=CONF.firebase||{};
var DOMAIN=(CONF.emailDomain||'breakboard.example.com').toLowerCase();
var ADMIN_EMAILS=(CONF.adminEmails||['mytabonepluse@gmail.com']).map(function(e){return String(e).toLowerCase()});
var app=document.getElementById('app');
var configured=!!(cfg.apiKey&&String(cfg.apiKey).indexOf('PASTE')!==0&&cfg.projectId&&String(cfg.projectId).indexOf('PASTE')!==0);
var fs=null,auth=null;
var user=null,isAdmin=false,me=null,myEmail='',authReady=false;
var dbErr='',slow=false;
var staff=[],types=DEFAULT_TYPES.slice(),live=[],breaks=[];
var got={staff:false,live:false};
var subs=[];
var tab='board',picking=null,customFor=null,customMin='',startAt='',busy={},confirmId=null,typeDraft=null;
var toastMsg='',toastTimer=null,loadTimer=null;
var loginUser='',loginPass='',loginErr='';
var showPin=false,newPin='';var maxAtOnce=0,atOnceDraft=null,editId=null,editStart='',editEnd='',theme='dark',bulkText='',bulkRes=null,popup=null,alerted={},newCred=null,audioCtx=null;
var addName='',addUser='',addPin='';
var today=dayKey(Date.now());
var range={from:today,to:today};

function applyTheme(){
  var r=document.documentElement;
  if(theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme);
}
function loadTheme(){try{var t=localStorage.getItem('bb-theme');if(t==='light'||t==='auto'||t==='dark')theme=t}catch(e){}applyTheme()}
function cycleTheme(){
  theme=theme==='dark'?'light':theme==='light'?'auto':'dark';
  try{localStorage.setItem('bb-theme',theme)}catch(e){}
  applyTheme();render();
}
function pad(n){return String(n).padStart(2,'0')}
function dayKey(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function clock(sec){sec=Math.max(0,Math.floor(sec));var hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60),ss=sec%60;return hh?hh+':'+pad(mm)+':'+pad(ss):pad(mm)+':'+pad(ss)}
var tfmt=new Intl.DateTimeFormat([], {hour:'numeric',minute:'2-digit'});
function hm(ms){return tfmt.format(new Date(ms))}
function hm24(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())}
function dur(b){return Math.round((b.end-b.start)/60000)}
function overBy(b){return Math.max(0,dur(b)-(Number(b.allowed)||0))}
function prettyDay(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'})}
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){var v=attrs[k];
    if(v==null||v===false)return;
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);});
  for(var i=2;i<arguments.length;i++){
    [].concat(arguments[i]).forEach(function(c){
      if(c==null||c===false)return;
      e.append(c.nodeType?c:document.createTextNode(String(c)));});
  }
  return e;
}
function toast(m){toastMsg=m;clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastMsg='';render()},4500);render()}
function errMsg(e){
  var c=e&&e.code;
  if(c==='permission-denied')return 'Not allowed. Check the database rules.';
  if(c==='unavailable')return 'No connection. Try again.';
  if(c==='auth/email-already-in-use')return 'That username already has a login. Pick another, or delete it in Firebase first.';
  if(c==='auth/weak-password')return 'The PIN must be at least 6 characters.';
  if(c==='auth/requires-recent-login')return 'Sign out, sign in again, then change the PIN.';
  if(c==='auth/network-request-failed')return 'No connection. Try again.';
  return 'Something went wrong. Try again.';
}
function forgot(o){return o.end==null&&o.start<=Date.now()&&(Date.now()-o.start)/60000-o.allowed>=60}
function openFor(id){for(var i=0;i<live.length;i++){if(live[i].staffId===id)return live[i]}return null}
function todayStats(id){var n=0,t=0;breaks.forEach(function(b){if(b.staffId===id&&dayKey(b.start)===today){n++;t+=dur(b)}});return{n:n,t:t}}
function nameOf(b){for(var i=0;i<staff.length;i++){if(staff[i].id===b.staffId)return staff[i].name}return b.staffName||'Removed staff'}
function emailFor(id){return id+'@'+DOMAIN}

/* ---------- over-time reminders ---------- */
function beep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();
    [0,0.35,0.7].forEach(function(t){
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=880;g.gain.value=0.15;
      o.connect(g);g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+0.2);
    });
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}
}
function checkAlerts(){
  if(!user||!authReady)return;
  var now=Date.now(),fresh=[],anyOver=false;
  live.forEach(function(o){
    if(o.start>now)return;
    var used=now-o.start,limit=o.allowed*60000,over=used-limit,key=o.id+':'+o.start;
    if(over>=0){
      var last=alerted[key];
      if(last&&now-last<5*60000)return;
      alerted[key]=now;anyOver=true;
      var mins=Math.max(1,Math.floor(over/60000)),who=nameOf(o);
      fresh.push(isAdmin?(who+' is over time on '+o.type+' (over by '+(over<60000?'under 1':mins)+' min).')
        :('Your '+o.type+' break is over time (over by '+(over<60000?'under 1':mins)+' min). Please end your break.'));
    }else if(!isAdmin&&o.allowed>=3&&limit-used<=120000&&!alerted[key+':w']){
      alerted[key+':w']=now;
      fresh.push('Your '+o.type+' break ends in 2 minutes. Please wrap up.');
    }
  });
  if(!fresh.length)return;
  popup=popup||{items:[],over:false};
  popup.items=popup.items.concat(fresh);popup.over=popup.over||anyOver;
  beep();render();
}

/* ---------- actions ---------- */
function guard(key,fn){
  if(busy[key])return;busy[key]=true;
  Promise.resolve().then(fn).catch(function(e){toast(errMsg(e))}).then(function(){delete busy[key];render()});
}
function startMs(){
  if(!startAt)return Date.now();
  var p=startAt.split(':'),d=new Date();
  d.setHours(+p[0],+p[1],0,0);
  if(d.getTime()<Date.now()-60000)return null;
  return Math.max(d.getTime(),Date.now());
}
function startBreak(s,t){
  var st=startMs();
  if(st===null){toast('Pick a start time that has not passed yet.');return}
  guard('s'+s.id,function(){
    if(openFor(s.id))return;
    if(t.max>0){
      var c=0;breaks.forEach(function(b){if(b.staffId===s.id&&b.type===t.name&&dayKey(b.start)===today)c++});
      if(c>=t.max){toast(t.name+' limit reached: '+t.max+' per day.');return}
    }
    picking=null;customFor=null;customMin='';startAt='';
    return fs.collection('live').doc(s.id).set({staffId:s.id,staffName:s.name,type:t.name,allowed:t.allowed,start:st});
  });
}
function endBreak(b){
  guard('e'+b.id,function(){
    var end=Math.max(Date.now(),b.start);
    var batch=fs.batch();
    batch.set(fs.collection('breaks').doc(),{staffId:b.staffId,staffName:b.staffName||'',email:emailFor(b.staffId),type:b.type,allowed:b.allowed,start:b.start,end:end});
    batch.delete(fs.collection('live').doc(b.id));
    return batch.commit().then(function(){toast('Break recorded for '+nameOf(b)+'.')});
  });
}
function saveEdit(b){
  var p=dayKey(b.start).split('-'),a=editStart.split(':'),z=editEnd.split(':');
  if(a.length<2||z.length<2){toast('Enter both times.');return}
  var st=new Date(+p[0],+p[1]-1,+p[2],+a[0],+a[1],0,0).getTime(),en=new Date(+p[0],+p[1]-1,+p[2],+z[0],+z[1],0,0).getTime();
  if(en<st)en+=86400000;
  if(en-st>12*3600000){toast('A break cannot be longer than 12 hours.');return}
  guard('ed'+b.id,function(){
    return fs.doc('breaks/'+b.id).update({start:st,end:en}).then(function(){editId=null;toast('Break updated.')});
  });
}
function deleteBreak(b){
  confirmId=null;
  guard('d'+b.id,function(){return fs.doc((b.live?'live/':'breaks/')+b.id).delete()});
}
function createLogin(username,pin){
  var sec;
  try{sec=firebase.app('secondary')}catch(e){sec=firebase.initializeApp(cfg,'secondary')}
  var a=sec.auth();
  return a.createUserWithEmailAndPassword(emailFor(username),pin).then(function(){return a.signOut()});
}
function addStaff(){
  var name=addName.trim().slice(0,60),un=addUser.trim().toLowerCase(),pin=addPin.trim();
  if(!name){toast('Enter the staff name.');return}
  if(!/^[a-z0-9._-]{2,30}$/.test(un)){toast('Username: 2 to 30 letters or numbers, no spaces.');return}
  if(pin.length<6){toast('The PIN must be at least 6 characters.');return}
  var existing=null;staff.forEach(function(s){if(s.id===un)existing=s});
  guard('addstaff',function(){
    return createLogin(un,pin).then(function(){
      return fs.doc('staff/'+un).set({name:name,username:un,order:existing?existing.order:Date.now()},{merge:true});
    }).then(function(){
      newCred={name:name,username:un,pin:pin};
      addName='';addUser='';addPin='';
    });
  });
}
function bulkAdd(){
  var lines=bulkText.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
  if(!lines.length){toast('Paste one staff per line: Name, username, PIN');return}
  if(lines.length>100){toast('Add up to 100 at a time.');return}
  guard('bulk',function(){
    var res=[],chain=Promise.resolve();
    lines.forEach(function(l){
      chain=chain.then(function(){
        var p=l.split(',').map(function(x){return x.trim()});
        var name=(p[0]||'').slice(0,60),un=(p[1]||'').toLowerCase(),pin=p[2]||'';
        if(!name||!/^[a-z0-9._-]{2,30}$/.test(un)||pin.length<6){res.push({name:name||l,username:un,pin:pin,ok:false,err:'Check the line format'});return}
        return createLogin(un,pin).then(function(){
          return fs.doc('staff/'+un).set({name:name,username:un,order:Date.now()+res.length},{merge:true});
        }).then(function(){res.push({name:name,username:un,pin:pin,ok:true})},
          function(e){res.push({name:name,username:un,pin:pin,ok:false,err:errMsg(e)})});
      });
    });

function tick(){
  if(dayKey(Date.now())!==today){today=dayKey(Date.now());render();return}
  var ck=document.getElementById('now-clock');
  if(ck)ck.textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});
  document.querySelectorAll('[data-open]').forEach(function(c){
    var start=+c.dataset.start,allowed=+c.dataset.allowed;
    var info=c.querySelector('.info'),act=c.querySelector('.act'),typ=c.dataset.type;
    if(Date.now()<start){
      c.dataset.state='sched';
      c.querySelector('.timer').textContent=clock((start-Date.now())/1000);
      info.textContent=typ+' · counting starts at '+hm(start);
      c.querySelector('.left').textContent='starts in';
      c.querySelector('.meter span').style.width='0%';
      var sp=c.querySelector('[data-pill]');sp.className='pill idle';sp.textContent='Scheduled';
      act.textContent='Cancel break';
      return;
    }
    info.textContent=typ+' · started '+hm(start);
    act.textContent='End break';
    var el=(Date.now()-start)/1000,lim=allowed*60;
    var state=el>lim?'over':(lim-el<=120?'warn':'ok');
    c.dataset.state=state;
    c.querySelector('.timer').textContent=clock(el);
    c.querySelector('.left').textContent=el>lim?('Over by '+clock(el-lim)):(clock(lim-el)+' left');
    c.querySelector('.meter span').style.width=Math.min(100,lim>0?el/lim*100:100)+'%';
    var p=c.querySelector('[data-pill]');
    p.className='pill '+(state==='over'?'bad':state==='warn'?'warn':'on');
    p.textContent=state==='over'?((el-lim)/60>=60?'Forgot to end?':'Over time'):'On break';
  });
}

  return h('form',{class:'panel narrow',onsubmit:function(e){e.preventDefault();doLogin()}},
    h('h2',{},'Sign in'),
    h('p',{class:'note'},'Staff: your username and PIN. Admin: your email and password.'),
    h('label',{},'Username or email',h('input',{type:'text',id:'l-user',autocomplete:'username',autocapitalize:'none',value:loginUser,oninput:function(e){loginUser=e.target.value}})),
    h('label',{},'PIN or password',h('input',{type:'password',id:'l-pass',autocomplete:'current-password',value:loginPass,oninput:function(e){loginPass=e.target.value}})),
    loginErr?h('p',{class:'err',role:'alert'},loginErr):null,
    h('button',{class:'btn',type:'submit',disabled:busy.login},'Sign in'));
}
function pinView(){
  return h('form',{class:'panel narrow',onsubmit:function(e){e.preventDefault();changePin()}},
    h('h2',{},'Change PIN'),
    h('label',{},'New PIN (6+ characters)',h('input',{type:'password',id:'new-pin',autocomplete:'new-password',value:newPin,oninput:function(e){newPin=e.target.value}})),
    h('div',{class:'row'},
      h('button',{class:'btn',type:'submit',disabled:busy.pin},'Save PIN'),
      h('button',{class:'btn quiet',type:'button',onclick:function(){showPin=false;newPin='';render()}},'Cancel')));
}
function needSetupView(){
  return h('div',{class:'empty'},
    h('strong',{},'Database not connected yet'),
    h('span',{},'Open config.js in this repository and paste your Firebase settings. The steps are in README.md.'));
}

/* ---------- shell ---------- */
function go(t){tab=t;picking=null;customFor=null;startAt='';confirmId=null;editId=null;if(t==='setup'){typeDraft=null;atOnceDraft=null}render()}
function render(){
  var ae=document.activeElement,keep=null;
  if(ae&&ae.id&&app.contains(ae)&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')){keep={id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd}}
  if(!isAdmin&&tab!=='board')tab='board';
  var tabs=[['board','Board'],['report','Report'],['setup','Setup']];
  var right=[];
  if(user&&isAdmin){
    right.push(h('nav',{class:'tabs','aria-label':'Sections'},tabs.map(function(t){return h('button',{class:'tab',type:'button','aria-pressed':String(tab===t[0]),onclick:function(){go(t[0])}},t[1])})));
    right.push(h('button',{class:'btn quiet small',type:'button',onclick:doLogout},'Sign out'));
  }else if(user){
    right.push(h('button',{class:'btn quiet small',type:'button',onclick:function(){showPin=!showPin;render()}},'Change PIN'));
    right.push(h('button',{class:'btn quiet small',type:'button',onclick:doLogout},'Sign out'));
  }
  right.push(h('button',{class:'btn quiet small',type:'button',id:'theme-btn','aria-label':'Change theme',onclick:cycleTheme},theme==='auto'?'Theme: Auto':theme==='light'?'Theme: Light':'Theme: Dark'));
  var who=user&&!isAdmin&&staff.length?staff[0].name:'';
  var kids=[h('header',{},
    h('div',{},h('h1',{},'Break Board'),h('p',{class:'tagline'},'Great service starts with well-rested people.'),h('p',{class:'date'},(who?who+' · ':'')+new Date().toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'})+' · ',h('span',{class:'clk',id:'now-clock'},''))),
    h('div',{class:'hright'},right))];
  if(!configured){
    kids.push(needSetupView());
  }else if(!authReady){
    kids.push(h('p',{class:'note'},'Loading…'));
  }else if(!user){
    kids.push(loginView());
  }else{
    if(dbErr==='permission-denied')kids.push(h('div',{class:'banner bad'},'The database rules are missing or out of date. Follow step 3 in README.md.'));
    else if(dbErr)kids.push(h('div',{class:'banner bad'},'Cannot reach the database. Check your internet and the settings in config.js.'));
    else if(slow&&!(got.staff&&got.live))kids.push(h('div',{class:'banner'},"Can't reach the saved data yet. This page keeps trying."));
    if(showPin&&!isAdmin)kids.push(pinView());
    kids=kids.concat(tab==='board'?boardView():tab==='report'?reportView():setupView());
  }
  if(popup&&user)kids.push(h('div',{class:'modal-back'},h('div',{class:'modal',role:'alertdialog','aria-modal':'true','aria-label':'Over time reminder'},
    h('h2',{},popup.over?'Break over time':'Break ending soon'),
    h('ul',{},popup.items.slice(-6).map(function(m){return h('li',{},m)})),
    h('button',{class:'btn wide',type:'button',id:'popup-ok',onclick:function(){popup=null;render()}},'OK'))));
  if(toastMsg)kids.push(h('div',{class:'toast',role:'status'},toastMsg));
  app.replaceChildren.apply(app,kids);
  if(keep){var el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(x){}}}
  tick();
}

/* ---------- data ---------- */
function stopAll(){
  subs.forEach(function(u){try{u()}catch(e){}});subs=[];
  staff=[];live=[];breaks=[];got={staff:false,live:false};dbErr='';slow=false;clearTimeout(loadTimer);
}
function fail(e){dbErr=(e&&e.code)||'error';render()}
function mapLive(id,x){return{id:id,live:true,staffId:x.staffId||id,staffName:x.staffName,type:String(x.type||''),allowed:Number(x.allowed)||0,start:Number(x.start)||0,end:null}}
function mapBreak(d){var x=d.data()||{};return{id:d.id,staffId:x.staffId,staffName:x.staffName,type:String(x.type||''),allowed:Number(x.allowed)||0,start:Number(x.start)||0,end:Number(x.end)||0}}
function typesSub(){
  return fs.doc('config/types').onSnapshot(function(snap){
    var x=snap.exists?snap.data():null;
    types=(x&&Array.isArray(x.list)&&x.list.length)?x.list.map(function(t){return{name:String(t.name),allowed:Number(t.allowed)||10,max:Math.max(0,Number(t.max)||0)}}):DEFAULT_TYPES.slice();
    maxAtOnce=Math.max(0,Number(x&&x.maxAtOnce)||0);
    if(tab!=='setup'){typeDraft=null;atOnceDraft=null}
    render();
  },fail);
}
function startAdmin(){
  stopAll();
  loadTimer=setTimeout(function(){slow=true;render()},10000);
  subs.push(fs.collection('staff').onSnapshot(function(snap){
    staff=snap.docs.map(function(d){var x=d.data()||{};return{id:d.id,name:String(x.name||d.id),order:Number(x.order)||0}})
      .sort(function(a,b){return a.order-b.order||a.name.localeCompare(b.name)});
    got.staff=true;dbErr='';render();
  },fail));
  subs.push(fs.collection('live').onSnapshot(function(snap){
    live=snap.docs.map(function(d){return mapLive(d.id,d.data()||{})});
    got.live=true;clearTimeout(loadTimer);slow=false;dbErr='';render();
  },fail));
  subs.push(fs.collection('breaks').orderBy('start','desc').limit(1000).onSnapshot(function(snap){
    breaks=snap.docs.map(mapBreak);render();
  },fail));
  subs.push(typesSub());
}
function startStaff(){
  stopAll();
  loadTimer=setTimeout(function(){slow=true;render()},10000);
  subs.push(fs.doc('staff/'+me).onSnapshot(function(snap){
    var x=snap.exists?snap.data():null;
    staff=x?[{id:me,name:String(x.name||me),order:0}]:[];
    got.staff=true;dbErr='';render();
  },fail));
  subs.push(fs.doc('live/'+me).onSnapshot(function(snap){
    live=snap.exists?[mapLive(snap.id,snap.data()||{})]:[];
    got.live=true;clearTimeout(loadTimer);slow=false;dbErr='';render();
  },fail));
  subs.push(fs.collection('breaks').where('email','==',myEmail).limit(1000).onSnapshot(function(snap){
    breaks=snap.docs.map(mapBreak).sort(function(a,b){return b.start-a.start});render();
  },fail));
  subs.push(typesSub());
}
function onAuth(u){
  authReady=true;user=u;isAdmin=false;me=null;myEmail='';toastMsg='';popup=null;newCred=null;bulkRes=null;bulkText='';alerted={};popup=null;newCred=null;alerted={};
  if(!u){stopAll();render();return}
  myEmail=String(u.email||'').toLowerCase();
  if(ADMIN_EMAILS.indexOf(myEmail)>-1){isAdmin=true;startAdmin()}
  else if(myEmail.slice(-(DOMAIN.length+1))==='@'+DOMAIN){me=myEmail.slice(0,-(DOMAIN.length+1));startStaff()}
  else{toast('This account is not set up for Break Board.');auth.signOut();return}
  render();
}
function init(){
  loadTheme();
  render();
  if(configured){
    try{
      if(typeof firebase==='undefined')throw new Error('Firebase did not load');
      firebase.initializeApp(cfg);
      fs=firebase.firestore();auth=firebase.auth();
      auth.onAuthStateChanged(onAuth);
    }catch(e){authReady=true;dbErr='error';render()}
  }
  setInterval(function(){tick();checkAlerts()},1000);
}
init();
})();
</script>
</body>
</html>
